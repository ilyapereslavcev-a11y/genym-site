<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — GenyM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0f1a, #1a1a2e); min-height: 100vh; }
    .card { background: rgba(30, 30, 50, 0.5); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 16px; }
  </style>
</head>
<body class="text-white">
  <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="index.html" class="text-xl font-bold text-cyan-400">GenyM</a>
    <button id="logout" class="text-gray-400 hover:text-white transition">Выйти</button>
  </nav>

  <main class="container mx-auto px-4 pb-12 max-w-2xl">
    <div id="loading" class="text-center py-20 text-gray-400">Загрузка...</div>
    
    <div id="content" class="hidden">
      <div class="card p-6 mb-8 text-center">
        <h2 class="text-2xl font-semibold mb-2">Привет, <span id="user-name"></span>! 👋</h2>
        <div class="text-3xl font-bold text-cyan-400 mt-4">
          💰 Баланс: <span id="user-balance">0</span> Б
        </div>
      </div>

      <h3 class="text-xl font-semibold mb-4">📁 Мои генерации</h3>
      <div id="results" class="space-y-4">
        <p class="text-gray-400">Пока ничего нет — результаты появятся здесь, когда ты создашь что-то!</p>
      </div>
    </div>
  </main>

  <script>
    const userId = localStorage.getItem('userId');
    if (!userId) {
      window.location.href = 'index.html';
    }

    fetch(`/api/user/${userId}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('user-name').textContent = data.user.first_name || 'друг';
        document.getElementById('user-balance').textContent = data.user.balance;

        const container = document.getElementById('results');
        if (data.results.length > 0) {
          container.innerHTML = data.results.map(r => `
            <div class="card p-4">
              <div class="font-medium">${r.model}</div>
              <p class="text-gray-400 text-sm mt-1">${r.description || '—'}</p>
              ${r.media_url ? `<a href="${r.media_url}" target="_blank" class="text-cyan-400 text-sm mt-2 inline-block">Открыть результат ↗</a>` : ''}
              <div class="text-xs text-gray-500 mt-2">${new Date(r.created_at).toLocaleString('ru-RU')}</div>
            </div>
          `).join('');
        }
      });

    document.getElementById('logout').onclick = () => {
      localStorage.removeItem('userId');
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
